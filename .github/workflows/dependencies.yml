name: Dependency graph
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true
jobs:
  submit:
    name: Submit resolved dependencies
    if: github.repository == 'bathos-labs/svt-dotnet' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read exact SDK pin
        id: sdk
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./global.json').sdk.version + '\n')"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/svt-dotnet-sdk
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
      - name: Restore locked dependencies
        run: dotnet restore SvgTemplates.slnx --locked-mode
      - name: Submit NuGet and npm dependencies
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
        with:
          fail-on-empty: true
          detectorsCategories: NuGet,Npm
          detectorArgs: NpmLockfile3=EnableIfDefaultOff
          directoryExclusionList: artifacts,node_modules,bin,.git
