name: Validation
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
    outputs:
      candidate_artifact:
        description: Validated package bundle and Ubuntu/Windows receipts
        value: ${{ jobs.windows.outputs.candidate-artifact }}
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  validation:
    name: Documentation, library and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      coverage-artifact: coverage-linux-${{ github.run_attempt }}
      package-version: ${{ steps.package.outputs.version }}
      transfer-artifact: package-candidate-${{ steps.package.outputs.version }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check whitespace
        run: git show --format= --check HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Read exact package SDK pin
        id: sdk
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./global.json').sdk.version + '\n')"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          # Isolate the pin from newer SDKs preinstalled on the hosted runner.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/svt-dotnet-sdk
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
      - name: Run full validation gate
        run: node eng/check.mjs
      - name: Collect and verify line and branch coverage
        run: node eng/coverage/run.mjs
      - name: Retain coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-linux-${{ github.run_attempt }}
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare package from validated commit
        id: package
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            node eng/package/prepare.mjs --release "$RELEASE_TAG"
          else
            node eng/package/prepare.mjs
          fi
      - name: Consume the package on Ubuntu
        run: node eng/package/consume.mjs
      - name: Stage exact bundle and Ubuntu receipt
        run: |
          node --input-type=module <<'JS'
          import {readFile,cp,copyFile,mkdir} from 'node:fs/promises';
          const {bundle}=JSON.parse(await readFile('artifacts/package-current.json'));
          const {report}=JSON.parse(await readFile('artifacts/package-consumption-current.json'));
          await mkdir('artifacts/package-transfer', {recursive:true});
          await cp(bundle, 'artifacts/package-transfer/bundle', {recursive:true});
          await copyFile(report, 'artifacts/package-transfer/ubuntu.json');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-candidate-${{ steps.package.outputs.version }}-${{ github.run_attempt }}
          path: artifacts/package-transfer/
          if-no-files-found: error
          retention-days: 14
      - name: Retain package failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-diagnostics-ubuntu-${{ github.run_attempt }}
          path: |
            artifacts/validation/gate.json
            artifacts/packages/*/pack.log
            artifacts/package-consumption/
          if-no-files-found: ignore
          retention-days: 7

  windows:
    name: Library and CLI on Windows
    needs: validation
    outputs:
      candidate-artifact: ${{ steps.identity.outputs.name }}
      coverage-artifact: coverage-windows-${{ github.run_attempt }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Read exact package SDK pin
        id: sdk
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./global.json').sdk.version + '\n')"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/svt-dotnet-sdk
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
      - name: Restore locked dependencies
        run: dotnet restore SvgTemplates.slnx --locked-mode
      - name: Build Release with analyzers
        run: dotnet build SvgTemplates.slnx -c Release --no-restore
      - name: Test library and CLI
        run: dotnet test --solution SvgTemplates.slnx -c Release --no-build
      - name: Collect and verify line and branch coverage
        run: node eng/coverage/run.mjs
      - name: Retain coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-windows-${{ github.run_attempt }}
          path: artifacts/coverage/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.validation.outputs.transfer-artifact }}
          path: artifacts/package-transfer
          digest-mismatch: error
      - name: Consume the identical package on Windows
        run: node eng/package/consume.mjs artifacts/package-transfer/bundle
      - name: Finalize package candidate evidence
        shell: pwsh
        run: |
          $receipt = (Get-Content artifacts/package-consumption-current.json | ConvertFrom-Json).report
          Copy-Item $receipt artifacts/package-transfer/windows.json
          node eng/package/finalize.mjs artifacts/package-transfer/bundle artifacts/package-transfer/ubuntu.json artifacts/package-transfer/windows.json artifacts/package-transfer/handoff.json
      - name: Name validated artifact
        id: identity
        shell: pwsh
        env:
          CANDIDATE_NAME: validated-package-${{ needs.validation.outputs.package-version }}-${{ github.run_attempt }}
        run: Add-Content -Path $env:GITHUB_OUTPUT -Value "name=$env:CANDIDATE_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.identity.outputs.name }}
          path: artifacts/package-transfer/
          if-no-files-found: error
          retention-days: 30
      - name: Retain package failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-diagnostics-windows-${{ github.run_attempt }}
          path: artifacts/package-consumption/
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Complete coverage upload
    needs: [validation, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.validation.outputs.coverage-artifact }}
          path: artifacts/coverage/linux
          digest-mismatch: error
      - name: Upload linux coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          # External fork PRs use Codecov's public tokenless upload support.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: artifacts/coverage/linux/normalized/library.info,artifacts/coverage/linux/normalized/cli.info
          flags: linux
          disable_search: true
          fail_ci_if_error: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.windows.outputs.coverage-artifact }}
          path: artifacts/coverage/windows
          digest-mismatch: error
      - name: Upload windows coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          # External fork PRs use Codecov's public tokenless upload support.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: artifacts/coverage/windows/normalized/library.info,artifacts/coverage/windows/normalized/cli.info
          flags: windows
          disable_search: true
          fail_ci_if_error: true
