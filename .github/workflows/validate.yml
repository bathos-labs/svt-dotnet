name: Validation
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
jobs:
  validation:
    name: Documentation, library and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      package-version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check whitespace
        run: git show --format= --check HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          # Isolate the pin from newer SDKs preinstalled on the hosted runner.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/svt-dotnet-sdk
        with:
          global-json-file: global.json
      - name: Run full validation gate
        run: node eng/check.mjs
      - name: Prepare package from validated commit
        id: package
        run: node eng/package/prepare.mjs
      - name: Consume the package on Ubuntu
        run: node eng/package/consume.mjs
      - name: Stage exact bundle and Ubuntu receipt
        run: |
          node --input-type=module <<'JS'
          import {readFile,cp,copyFile,mkdir} from 'node:fs/promises';
          const {bundle}=JSON.parse(await readFile('artifacts/package-current.json'));
          const {report}=JSON.parse(await readFile('artifacts/package-consumption-current.json'));
          await mkdir('artifacts/package-transfer', {recursive:true});
          await cp(bundle, 'artifacts/package-transfer/bundle', {recursive:true});
          await copyFile(report, 'artifacts/package-transfer/ubuntu.json');
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-candidate-${{ steps.package.outputs.version }}
          path: artifacts/package-transfer/
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Library and CLI on Windows
    needs: validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/svt-dotnet-sdk
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore SvgTemplates.slnx --locked-mode
      - name: Build Release with analyzers
        run: dotnet build SvgTemplates.slnx -c Release --no-restore
      - name: Test library and CLI
        run: dotnet test --solution SvgTemplates.slnx -c Release --no-build
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: package-candidate-${{ needs.validation.outputs.package-version }}
          path: artifacts/package-transfer
          digest-mismatch: error
      - name: Consume the identical package on Windows
        run: node eng/package/consume.mjs artifacts/package-transfer/bundle
      - name: Finalize private trial evidence
        shell: pwsh
        run: |
          $receipt = (Get-Content artifacts/package-consumption-current.json | ConvertFrom-Json).report
          Copy-Item $receipt artifacts/package-transfer/windows.json
          node eng/package/finalize.mjs artifacts/package-transfer/bundle artifacts/package-transfer/ubuntu.json artifacts/package-transfer/windows.json artifacts/package-transfer/handoff.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: private-trial-${{ needs.validation.outputs.package-version }}-${{ github.run_attempt }}
          path: artifacts/package-transfer/
          if-no-files-found: error
          retention-days: 30
