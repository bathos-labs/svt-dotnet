version: '3'

vars:
  # Keep CI and CONTRIBUTING.md synchronized when upgrading.
  PRETTIER_VERSION: '3.9.10'
  REMARK_PACKAGES: >-
    --package=remark-cli@12.0.1 --package=remark-gfm@4.0.1
    --package=remark-validate-links@13.1.0 --package=remark-lint-no-undefined-references@5.0.2

tasks:
  default:
    desc: List development commands
    silent: true
    cmds:
      - task --list

  docs:format:
    desc: Wrap Markdown prose and align tables
    cmds:
      - npx --yes prettier@{{.PRETTIER_VERSION}} --write "**/*.md"

  docs:check:
    desc: Verify Markdown formatting without edits
    cmds:
      - npx --yes prettier@{{.PRETTIER_VERSION}} --check "**/*.md"

  docs:links:
    desc: Check local Markdown files, references and heading anchors without HTTP requests
    cmds:
      - >-
        npx --yes {{.REMARK_PACKAGES}} remark --rc-path .remarkrc.cjs
        --ignore-path .prettierignore --frail --no-stdout --no-color .

  docs:links:test:
    desc: Verify link-checker configuration using disposable fixtures
    cmds:
      - npx --yes {{.REMARK_PACKAGES}} node eng/CheckDocumentationLinks.test.cjs

  dotnet:check:
    desc: Verify locked restore, C# formatting, Release analyzers and tests
    cmds:
      - dotnet restore SvgTemplates.slnx --locked-mode
      - dotnet format SvgTemplates.slnx --no-restore --verify-no-changes
      - dotnet build SvgTemplates.slnx -c Release --no-restore
      - dotnet test --solution SvgTemplates.slnx -c Release --no-build

  native:check:
    desc: Verify the native evidence harness without launching renderers
    cmds:
      - npm ci --prefix eng/visual --ignore-scripts
      - node --test eng/visual/*.test.mjs

  native:setup:
    desc: Install and verify pinned native validation tools
    cmds:
      - npm ci --prefix eng/visual --ignore-scripts
      - node eng/visual/node_modules/puppeteer/install.mjs
      - node eng/visual/setup.mjs

  native:release:render:
    desc: Run repeatable Chrome/resvg release checks (optional corpus and baseline arguments)
    cmds:
      - node eng/visual/release-render.mjs {{.CLI_ARGS}}

  native:release:authoring:
    desc: Run repeatable Inkscape release checks (supply executable path)
    cmds:
      - node eng/visual/release-authoring.mjs {{.CLI_ARGS}}

  native:probe:render:
    desc: Explore renderer XML-base support; does not provide a release verdict
    cmds:
      - node eng/visual/probe-render.mjs

  native:probe:authoring:
    desc: Explore optimized export (supply Inkscape executable); does not provide a release verdict
    cmds:
      - node eng/visual/probe-authoring.mjs {{.CLI_ARGS}}

  package:check:
    desc: Prepare and consume a review-only package after the full gate
    cmds:
      - node eng/package/prepare.mjs --review
      - node eng/package/consume.mjs

  package:prepare:
    desc: Prepare a private handoff candidate from a clean commit with a matching gate receipt
    cmds:
      - node eng/package/prepare.mjs

  package:consume:
    desc: Validate the supplied package bundle through an isolated consumer
    cmds:
      - node eng/package/consume.mjs {{.CLI_ARGS}}

  check:
    desc: Check documentation, library, CLI and validation tooling; record source identity
    cmds:
      - node eng/check.mjs
